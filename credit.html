<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>MBS INC | Credits</title>

    <style>
        :root {
            --green: #4CAF50;
            --dark: #121212;
            --text: #eaeaea;
            --muted: #aaaaaa;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            padding: 80px 10% 40px;
            text-align: center;
        }

        .logo {
            width: 140px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--green);
            margin: 0;
            font-size: 2.5rem;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 10px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 10%;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .role {
            color: var(--green);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .name {
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            padding: 40px 10%;
            color: var(--muted);
            font-size: 0.9rem;
        }

        a {
            color: var(--green);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            header {
                padding: 60px 20px 20px;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="https://minhbaostudio.vercel.app/mbslogotype8.png" class="logo" alt="MBS Logo">
        <h1>CREDITS</h1>
        <div class="subtitle">MBS INC OFFICIAL WEBSITE</div>
    </header>

    <div class="container">

        <div class="card">
            <div class="role">Lead Developer</div>
            <div class="name">MinhbaoGDVN</div>
        </div>

        <div class="card">
            <div class="role">Technical Assistant</div>
            <div class="name">Gemini (AI Support)</div>
        </div>

        <div class="card">
            <div class="role">Project Direction & Management</div>
            <div class="name">MBS Inc</div>
        </div>

        <div class="card">
            <div class="role">License</div>
            <div class="name">MIT License (2026)</div>
        </div>

    </div>

    <footer>
        Built with iteration, debugging and late-night development.<br>
        © 2026 MinhbaoGDVN & MBS INC
    </footer>

</body>
</html>
