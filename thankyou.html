<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảm ơn | MBS INC</title>
    <style>
        :root { --green: #4CAF50; --dark: #121212; }
        body { font-family: 'Inter', sans-serif; margin: 0; line-height: 1.6; color: #333; }
        
        /* Navbar giữ nguyên */
        nav { padding: 15px 10%; display: flex; align-items: center; border-bottom: 1px solid #eee; }
        .logo { width: 140px; }
        
        /* Nội dung chính */
        .thank-section { padding: 100px 10%; text-align: center; min-height: 50vh; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: inline-block; }
        h1 { color: var(--green); }
        .btn { display: inline-block; padding: 12px 25px; background: var(--green); color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; font-weight: 600; }
        
        /* Footer giữ nguyên */
        footer { background: var(--dark); color: white; padding: 40px 10%; text-align: center; }
        .copyright { display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0.7; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav>
        <img src="https://i.postimg.cc/MTSGKPG6/mbslogotype8.png" class="logo">
        <div style="margin-left: auto; font-weight: 600;">MBS INC Notification</div>
    </nav>

    <section class="thank-section">
        <div class="box">
            <h1>Tin nhắn đã được gửi!</h1>
            <p>Cảm ơn bạn đã liên hệ với MBS INC. Chúng tôi đã nhận được thông tin và sẽ phản hồi sớm nhất.</p>
            <p>Trong lúc chờ đợi, hãy khám phá các dự án mới nhất của chúng tôi nhé!</p>
            <a href="../../index.html" class="btn">Quay về trang chủ</a>
        </div>
    </section>

    <footer>
        <div class="copyright">
            <svg width="24" height="16" viewBox="0 0 750 500" xmlns="http://www.w3.org/2000/svg">
                <rect width="750" height="500" fill="#da251d"/>
                <path d="M375,125L282.8,409.2L534.6,233.3L215.4,233.3L467.2,409.2Z" fill="#ff0"/>
            </svg>
            &copy; 2026 MinhbaoGDVN and MBS Inc - All rights reserved.
        </div>
    </footer>

</body>
</html>
